spring:
  sql:
    init:
      mode: always
  datasource:
    postgres:
      hikari:
        jdbc-url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/tourbuzz-test}
        username: ${POSTGRES_USERNAME:postgres}
        password: ${POSTGRES_PASSWORD:admin}
        driver-class-name: org.postgresql.Driver
        auto-commit: false
        minimum-idle: 10
        maximum-pool-size: 10
    sqlite:
      hikari:
        jdbc-url: jdbc:sqlite:sqlite/db.sqlite
        username:
        password:
        driver-class-name: org.sqlite.JDBC
        initialization-mode: always
    flyway:
      enabled: true
  mail:
    protocol: smtp
    test-connection: false
    host: ${MAIL_HOST:smtp.example.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:example@email.com}
    password: ${MAIL_PASSWORD:password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
        debug: false
pagehelper:
  helperDialect: postgresql
  reasonable: true
  supportMethodsArguments: true
  params: count=countSql
server:
  port: ${PORT:8080}
  url: ${SERVER_URL:localhost:8080}
client:
  url: ${CLIENT_URL:localhost:3030}
springdoc:
  api-docs:
    path: /api-docs

