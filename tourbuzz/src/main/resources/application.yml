
spring:
  sql:
    init:
      mode: always
  datasource:
    postgres:
      hikari:
        jdbc-url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/tourbuzz}
        username: ${POSTGRES_USERNAME:postgres}
        password: ${POSTGRES_PASSWORD:admin}
        driver-class-name: org.postgresql.Driver
        auto-commit: false
        minimum-idle: 10
        maximum-pool-size: 10
    sqlite:
      hikari:
        jdbc-url: jdbc:sqlite:sqlite/sqlite.db
        username:
        password:
        driver-class-name: org.sqlite.JDBC
        initialization-mode: always
        data: classpath:sqlite-init.sql
  mail:
    protocol: smtp
    test-connection: false
    host: ${MAIL_HOST:smtp.example.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:example@email.com}
    password: ${MAIL_PASSWORD:password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
        debug: false
mybatis:
  configuration:
    map-underscore-to-camel-case: false
pagehelper:
  helperDialect: postgresql
  reasonable: true
  supportMethodsArguments: true
  params: count=countSql
server:
  port: ${PORT:8080}
flyway:
  url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/tourbuzz}
  username: ${POSTGRES_USERNAME:postgres}
  password: ${POSTGRES_PASSWORD:admin}
  driver-class-name: org.postgresql.Driver
  baselineOnMigrate: true
  locations: classpath:db/migration/{vendor}
springdoc:
  api-docs:
    path: /api-docs
local: true
