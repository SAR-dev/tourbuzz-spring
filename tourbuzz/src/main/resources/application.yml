
spring:
  sql:
    init:
      mode: always
  datasource:
    postgres:
      hikari:
        jdbc-url: ${POSTGRES_URL:jdbc:postgresql://arjuna.db.elephantsql.com/gupdibrt}
        username: ${POSTGRES_USERNAME:gupdibrt}
        password: ${POSTGRES_PASSWORD:tVMM6ZNIw7g5AGL4UHECASIbZqVpGbah}
        driver-class-name: org.postgresql.Driver
        auto-commit: false
        minimum-idle: 10
        maximum-pool-size: 10
  mail:
    protocol: smtp
    test-connection: false
    host: ${MAIL_HOST:smtp.example.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:example@email.com}
    password: ${MAIL_PASSWORD:password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
        debug: false
mybatis:
  configuration:
    map-underscore-to-camel-case: false
pagehelper:
  helperDialect: postgresql
  reasonable: true
  supportMethodsArguments: true
  params: count=countSql
server:
  port: ${PORT:8080}
frontend:
  url: ${FRONTEND_URL:http://localhost:3000}
flyway:
  url: ${POSTGRES_URL:jdbc:postgresql://arjuna.db.elephantsql.com/gupdibrt}
  username: ${POSTGRES_USERNAME:gupdibrt}
  password: ${POSTGRES_PASSWORD:tVMM6ZNIw7g5AGL4UHECASIbZqVpGbah}
  driver-class-name: org.postgresql.Driver
  baselineOnMigrate: true
  locations: classpath:db/migration/{vendor}
springdoc:
  api-docs:
    path: /api-docs
local: true
