<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Your website description here">
    <meta name="keywords" content="keywords, relevant, to, your, website">
    <meta name="author" content="Your Name">

    <!-- Primary Meta Tags -->
    <title>Your Website Title</title>
    <meta name="title" content="Your Website Title">
    <meta name="description" content="Your website description here">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://yourwebsite.com/">
    <meta property="og:title" content="Your Website Title">
    <meta property="og:description" content="Your website description here">
    <meta property="og:image" content="https://yourwebsite.com/image.jpg">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://yourwebsite.com/">
    <meta property="twitter:title" content="Your Website Title">
    <meta property="twitter:description" content="Your website description here">
    <meta property="twitter:image" content="https://yourwebsite.com/image.jpg">

    <!-- Favicon -->
    <link rel="icon" href="favicon.ico" type="image/x-icon">

    <meta http-equiv="refresh" content="0;url=http://redirect-to-this-page.com" />

</head>
<body></body>
</html>
