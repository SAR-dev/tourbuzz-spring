<!doctype html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <title>TourBuzz | Payment</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" integrity="sha512-wnea99uKIC3TJF7v4eKk4Y+lMz2Mklv18+r4na2Gn1abDRPPOeef95xTzdwGD9e6zXJBteMIhZ1+68QC5byJZw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <style>
        @media print {
          .hidden-print {
            display: none !important;
          }
        }
        html {
            font-family: "Inter", sans-serif;
        }
    </style>
</head>
<body>
<div class="h-screen w-full flex justify-center items-center">
    <div>
        <div class="p-5 rounded w-96 border border-gray-300">
            <div class="text-3xl text-center">✅</div>
            <div class="text-center font-medium text-xl mt-2">Payment Completed</div>
            <div class="mt-5 border border-gray-300 rounded grid grid-cols-2">
                <div class="p-3 font-medium border-b border-r border-gray-300">Payment ID</div>
                <div class="p-3 font-medium border-b border-gray-300 text-right" th:text="${data.paymentId}"></div>
                <div class="p-3 font-medium border-b border-r border-gray-300">Transaction ID</div>
                <div class="p-3 font-medium border-b border-gray-300 text-right" th:text="${data.transactionId}"></div>
                <div class="p-3 font-medium border-b border-r border-gray-300">Amount</div>
                <div class="p-3 font-medium border-b border-gray-300 text-right" th:text="${data.paymentAmount}"></div>
                <div class="p-3 font-medium border-b border-r border-gray-300">Currency</div>
                <div class="p-3 font-medium border-b border-gray-300 text-right" th:text="${data.currency}"></div>
                <div class="p-3 font-medium border-r border-gray-300">Reference No</div>
                <div class="p-3 font-medium border-gray-300 text-right" th:text="${data.referenceNo}"></div>
            </div>
        </div>

        <div class="flex w-full justify-center items-center mt-5 hidden-print">
            <div class="text-xs text-center">Save/Print this page for later. You can close this page and go back.</div>
        </div>
        <div class="flex w-full justify-center items-center mt-5 hidden-print">
            <button class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 focus:outline-none" onclick="window.print()">Print</button>
        </div>
        </div>
</div>
</body>
</html>
