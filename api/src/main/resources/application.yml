
spring:
  sql:
    init:
      mode: always
  datasource:
    postgres:
      hikari:
        jdbc-url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/tourbuzz?currentSchema=public}
        username: ${POSTGRES_USERNAME:postgres}
        password: ${POSTGRES_PASSWORD:admin}
        driver-class-name: org.postgresql.Driver
        auto-commit: false
        minimum-idle: 10
        maximum-pool-size: 10
    sqlite:
      hikari:
        jdbc-url: jdbc:sqlite:api/sqlite/sqlite.db
        username:
        password:
        driver-class-name: org.sqlite.JDBC
        initialization-mode: always
  mail:
    protocol: smtp
    test-connection: false
    host: smtp.example.com
    port: 587
    username: no-reply@example.com
    password: password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
        debug: true
mybatis:
  configuration:
    map-underscore-to-camel-case: false
pagehelper:
  helperDialect: postgresql
  reasonable: true
  supportMethodsArguments: true
  params: count=countSql
jwt:
  magic-token:
    secret-key: 7zy#&i=ft5q7r3uooj=r-bo2ffi&nhdq_trg_h23z8r2qw4^
    expiration-time: 1800
  access-token:
    secret-key: d7k*n2iz7!+lt58=n(2hz3*fh+ttrv9th(qw_5)*d_i67tzu
    expiration-time: 864000
server:
  port: ${PORT:8080}
flyway:
  url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/tourbuzz?currentSchema=public}
  username: ${POSTGRES_USERNAME:postgres}
  password: ${POSTGRES_PASSWORD:admin}
  driver-class-name: org.postgresql.Driver
  baselineOnMigrate: true
  locations: classpath:db/migration/{vendor}
springdoc:
  api-docs:
    path: /api-docs
imgbb:
  api-key: 613ee68f6bc89f194d175614a4ca500f
  baseurl: https://api.imgbb.com/1/upload
local: true
