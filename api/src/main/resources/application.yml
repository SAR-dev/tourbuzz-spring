
spring:
  sql:
    init:
      mode: always
  datasource:
    postgres:
      hikari:
        jdbc-url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/tourbuzz?currentSchema=public}
        username: ${POSTGRES_USERNAME:postgres}
        password: ${POSTGRES_PASSWORD:admin}
        driver-class-name: org.postgresql.Driver
        auto-commit: false
        minimum-idle: 10
        maximum-pool-size: 10
mybatis:
  configuration:
    map-underscore-to-camel-case: true
jwt:
  magictoken:
    secretkey: Dp/^po=<bbbTv&<Xg%&kL#8I3sg9|u
    expirationtime: 300000
  accesstoken:
    secretkey: Dp/^po=<bbbTv&<Xg%&kL#8I3sg9|u
    expirationtime: 300000
server:
  port: ${PORT:8080}
  servlet:
    contextPath: /api
flyway:
  url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/tourbuzz?currentSchema=public}
  username: ${POSTGRES_USERNAME:postgres}
  password: ${POSTGRES_PASSWORD:admin}
  driver-class-name: org.postgresql.Driver
  baselineOnMigrate: true
  locations: classpath:db/migration/{vendor}

